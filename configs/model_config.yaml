# ============================================================
# Конфигурация модели
# Обоснование: RTX 2060 Super (8GB VRAM), vocab_size=10000
# d_model=512, n_layers=6, d_ff=2048 => ~29M параметров
# Это максимум, что влезает в 8GB с batch_size=4, seq_len=512
# ============================================================
model:
  vocab_size: 10000
  d_model: 512
  n_heads: 8
  n_layers: 6
  d_ff: 2048
  max_len: 512

# ============================================================
# Конфигурация обучения
# ============================================================
training:
  batch_size: 4
  learning_rate: 3.0e-4       # Стандартный LR для AdamW
  weight_decay: 0.01
  warmup_steps: 500           # ~5% от общего числа шагов
  max_epochs: 20              # Может потребоваться больше/меньше
  gradient_clip_val: 1.0
  
  optimizer:
    name: "adamw"
    betas: [0.9, 0.999]
    eps: 1.0e-8
  
  scheduler:
    name: "cosine"
    T_max: 50000              # Общее число шагов (подберите под данные)
    eta_min: 1.0e-6

# ============================================================
# Конфигурация данных
# ============================================================
data:
  max_length: 512
  batch_size: 4
  num_workers: 4

# ============================================================
# Пути (из .env)
# ============================================================
paths:
  data_dir: "${oc.env:DATA_DIR}"
  tokenizer_path: "${oc.env:TOKENIZER_PATH}"
  checkpoint_dir: "${oc.env:CHECKPOINT_DIR}"