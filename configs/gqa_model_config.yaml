# ============================================================
# Конфигурация модели GQA
# Обоснование: RTX 2060 Super (8GB VRAM), vocab_size=10000
# d_model=512, n_layers=6, d_ff=2048 => ~29M параметров (до GQA)
# n_kv_heads=2 при n_heads=8 дает 4-кратное сокращение будущего
# KV-кэша и параметров W_k/W_v — запас по памяти на 8GB VRAM
# ============================================================
model:
  vocab_size: 10000
  d_model: 512
  n_heads: 8
  n_kv_heads: 2   # новое поле для GQA; n_heads % n_kv_heads == 0
  n_layers: 6
  d_ff: 2048
  max_len: 512

# ============================================================
# Конфигурация обучения
# ============================================================
training:
  batch_size: 16
  learning_rate: 3.0e-4     # Стандартный LR для AdamW 3e-4
  weight_decay: 0.1
  warmup_steps: 1000           # ~5% от общего числа шагов
  max_epochs: 3
  gradient_clip_val: 1.0

  optimizer:
    name: "adamw"
    betas: [0.9, 0.999]
    eps: 1.0e-8

  scheduler:
    name: "cosine"
    T_max: 52044              # Общее число шагов (подберите под данные)
    eta_min: 1.0e-6

# ============================================================
# Конфигурация данных
# ============================================================
data:
  max_length: 512
  batch_size: 16
  num_workers: 0

# ============================================================
# Пути (из .env)
# ============================================================
paths:
  data_dir: "${oc.env:DATA_DIR}"
  tokenizer_path: "${oc.env:TOKENIZER_PATH}"
  checkpoint_dir: "${oc.env:CHECKPOINT_DIR}/gqa"
